name: dms-connect-demo

services:
  dms:
    build: .
    init: true
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      HOST: 0.0.0.0
      npm_config_store_dir: /home/node/.pnpm-store
      MONGODB_URL: mongodb://mongo:27017
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - home:/home/node
    depends_on:
      mongo:
        condition: service_healthy
      sample-db:
        condition: service_healthy

  mongo:
    image: mongo:8
    attach: false
    volumes:
      - mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      retries: 30

  sample-db:
    build: sample-db
    attach: false
    environment:
      POSTGRES_DB: chinook
      POSTGRES_USER: chinook
      POSTGRES_PASSWORD: chinook
    volumes:
      - sample-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "chinook", "-d", "chinook"]
      interval: 2s
      retries: 30

volumes:
  node_modules:
  home:
  mongo:
  sample-db:
